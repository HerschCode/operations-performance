name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        # prefect (not dbt-core/dbt-postgres) is needed here: tests/test_pipeline_flow.py
        # imports flows/pipeline_flow.py at module level, which imports prefect -- but dbt is
        # only ever invoked as a subprocess inside a task body, never imported directly, so it
        # isn't needed for these (mocked, no live DB) unit tests to run. The full
        # requirements-orchestration.txt (dbt-core + dbt-postgres + prefect) is only needed to
        # actually run flows/pipeline_flow.py or dbt/, covered by .github/workflows/dbt.yml.
        run: pip install -r requirements.txt prefect

      - name: Run test suite
        run: python -m pytest tests/ -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check src/ tests/ scripts/ --output-format=github
        continue-on-error: true  # non-blocking for now -- tighten once the codebase is lint-clean

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --desc
        continue-on-error: true  # non-blocking initially -- a known vuln in a transitive
        # dependency shouldn't silently block every PR; this surfaces findings in the
        # Actions log for a human to triage, same non-blocking posture as the lint job
        # above until there's a reason to make either one a hard gate.
